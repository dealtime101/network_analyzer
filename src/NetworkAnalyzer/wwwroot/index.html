<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Analyzer</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--fg:#1f2328;--muted:#656d76;--line:#d0d7de;--accent:#0969da;--danger:#cf222e;--ok:#1a7f37;--warn:#9a6700;--warnbg:#fff8c5}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--fg:#e6edf3;--muted:#8d96a0;--line:#30363d;--accent:#58a6ff;--danger:#ff7b72;--ok:#3fb950;--warn:#d29922;--warnbg:#3b2e0a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0}nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{border:1px solid transparent;background:none;color:var(--fg);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button[aria-selected=true]{background:var(--accent);color:#fff}
.right{margin-left:auto;display:flex;gap:10px;align-items:center}
#langs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}#langs button{border:0;background:none;color:var(--fg);padding:3px 10px;cursor:pointer;font:inherit;font-size:13px}#langs button.on{background:var(--accent);color:#fff}
#pill{padding:3px 12px;border-radius:12px;font-size:13px;border:1px solid var(--line)}#pill.on{background:var(--ok);color:#fff;border-color:var(--ok)}
main{max-width:1180px;margin:0 auto;padding:14px 16px 60px}.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:0 0 14px}.card h2{font-size:16px;margin:0 0 8px}.card h3{font-size:14px;margin:12px 0 4px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.btn,a.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 14px;border-radius:6px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
button.lag{font-size:22px;padding:16px 28px;background:var(--danger);color:#fff;border:0;border-radius:10px;cursor:pointer;font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}button.on{outline:2px solid var(--accent)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
textarea{width:100%;min-height:60px}.muted{color:var(--muted)}.small{font-size:13px}
.warn{background:var(--warnbg);border:1px solid var(--warn);border-radius:6px;padding:8px 12px;margin:8px 0}.err{color:var(--danger)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;border-radius:10px;padding:0 9px;font-size:12px;color:#fff;background:var(--muted)}.b-low{background:#9a6700}.b-medium{background:#bc4c00}.b-high{background:#cf222e}
.tcard{border:1px solid var(--line);border-radius:8px;padding:8px 12px}.tcard b{font-size:14px}.tcard .m{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;margin-top:4px}
.tcard .m span{display:block;font-size:11px;color:var(--muted)}.tcard .m div{font-variant-numeric:tabular-nums;font-size:15px}.bad{color:var(--danger)}
canvas{width:100%;height:210px;display:block}.legend{font-size:12px;margin:2px 0 8px}.legend span{margin-right:14px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
ul{margin:.2em 0 .5em 1.2em;padding:0}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;display:none;max-width:90vw;z-index:9}
.tl{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0}.tl.lag{border-color:var(--danger)}.tl.episode{border-color:var(--warn)}
.sev-problem{color:var(--danger)}.sev-warning{color:var(--warn)}.sev-ok{color:var(--ok)}img.thumb{max-height:90px;border:1px solid var(--line);margin:4px}
@media(max-width:640px){button.lag{width:100%}}
</style>
</head>
<body>
<header>
  <h1><span data-i18n="app.title">Network Analyzer</span> <small id="ver" class="muted" style="font-weight:normal"></small></h1>
  <nav role="tablist">
    <button role="tab" data-tab="live" aria-selected="true" data-i18n="nav.live"></button>
    <button role="tab" data-tab="sat" data-i18n="nav.sat"></button>
    <button role="tab" data-tab="diag" data-i18n="nav.diag"></button>
    <button role="tab" data-tab="router" data-i18n="nav.router"></button>
    <button role="tab" data-tab="hist" data-i18n="nav.hist"></button>
    <button role="tab" data-tab="help" data-i18n="nav.help"></button>
  </nav>
  <div class="right"><div id="langs" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="fr">FR</button></div><span id="pill"></span></div>
</header>
<main>

<!-- ============ MONITORING ============ -->
<section id="tab-live" class="tab on">
  <div class="grid">
    <div class="card">
      <h2 data-i18n="live.start_h"></h2>
      <div class="row" id="dur">
        <button class="btn" data-min="10">10 min</button><button class="btn on" data-min="15">15 min</button>
        <button class="btn" data-min="20">20 min</button><button class="btn" data-min="30">30 min</button>
      </div>
      <label for="label" data-i18n="live.label"></label><input id="label" maxlength="80" style="width:100%">
      <div class="row">
        <div style="flex:1"><label for="link" data-i18n="live.link"></label><select id="link" style="width:100%"><option value="auto" data-i18n="link.auto"></option><option value="wifi" data-i18n="link.wifi"></option><option value="ethernet" data-i18n="link.ethernet"></option></select></div>
        <div style="flex:2"><label for="custom" data-i18n-html="live.custom"></label><input id="custom" data-i18n-ph="live.custom_ph" style="width:100%"></div>
      </div>
      <p class="small muted" data-i18n="live.blurb"></p>
      <div class="row"><button class="btn primary" id="start" data-i18n="live.start"></button><button class="btn" id="stop" disabled data-i18n="live.stop"></button><span id="remain" class="muted"></span></div>
      <ul id="notes" class="small muted"></ul>
    </div>
    <div class="card" style="text-align:center">
      <h2 data-i18n="lag.h"></h2>
      <button class="lag" id="lag" data-i18n="lag.btn"></button>
      <div style="margin-top:8px"><input id="lagnote" data-i18n-ph="lag.note_ph" maxlength="200" style="width:90%"></div>
      <p class="small muted" data-i18n="lag.blurb"></p>
      <ul id="marks" class="small" style="text-align:left"></ul>
      <button class="btn" id="seediag" style="display:none" data-i18n="lag.see"></button>
    </div>
    <div class="card">
      <h2><span data-i18n="env.h"></span> <button class="btn small" id="envr" style="float:right;padding:2px 10px" data-i18n="env.refresh"></button></h2>
      <div id="env" class="small">…</div>
    </div>
  </div>
  <div class="card"><h2><span data-i18n="cards.h"></span> <span class="muted small" data-i18n="cards.sub"></span></h2><div class="grid" id="tcards" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"></div></div>
  <div class="card"><h2 data-i18n="chart.latency"></h2><canvas id="c_lat"></canvas><div class="legend" id="l_lat"></div><p class="small muted" data-i18n="chart.latency_note"></p></div>
  <div class="grid">
    <div class="card"><h2 data-i18n="chart.traffic"></h2><canvas id="c_net"></canvas><div class="legend" id="l_net"></div></div>
    <div class="card"><h2 data-i18n="chart.dns"></h2><canvas id="c_dns"></canvas><div class="legend" id="l_dns"></div></div>
  </div>
  <div class="card" id="wifi_card"><h2 data-i18n="chart.wifi"></h2><canvas id="c_wifi"></canvas><div class="legend" id="l_wifi"></div><p class="small muted" data-i18n-html="chart.wifi_note"></p></div>
  <p class="small muted" data-i18n="chart.traffic_note"></p>
</section>

<!-- ============ SATURATION TEST ============ -->
<section id="tab-sat" class="tab">
  <div class="card">
    <h2 data-i18n="sat.h"></h2>
    <p data-i18n-html="sat.p1"></p>
    <p class="small muted" data-i18n-html="sat.p2"></p>
    <div class="row">
      <div><label for="phase_s" data-i18n="sat.phase_s"></label><select id="phase_s"><option value="10">10 s</option><option value="15" selected>15 s</option><option value="20">20 s</option><option value="30">30 s</option></select></div>
      <div><label for="cap" data-i18n="sat.cap"></label><select id="cap"><option value="300" data-i18n="sat.cap.300"></option><option value="600" selected data-i18n="sat.cap.600"></option><option value="1000" data-i18n="sat.cap.1000"></option><option value="2000" data-i18n="sat.cap.2000"></option></select></div>
      <div><label for="streams" data-i18n="sat.streams"></label><select id="streams"><option>2</option><option selected>4</option><option>6</option></select></div>
      <div><label for="slink" data-i18n="live.link"></label><select id="slink"><option value="auto" data-i18n="link.auto"></option><option value="wifi" data-i18n="link.wifi"></option><option value="ethernet" data-i18n="link.ethernet"></option></select></div>
      <div style="flex:1"><label for="slabel" data-i18n="sat.label"></label><input id="slabel" style="width:100%" maxlength="80"></div>
    </div>
    <div class="warn" id="est">…</div>
    <p class="small" id="before"></p>
    <label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" id="confirm"> <span data-i18n="sat.confirm"></span></label>
    <div class="row" style="margin-top:8px"><button class="btn danger" id="lt_start" disabled data-i18n="sat.start"></button><button class="btn" id="lt_cancel" disabled data-i18n="sat.cancel"></button><span id="lt_state" class="muted"></span></div>
    <ul id="lt_res" class="small"></ul>
    <div class="row"><button class="btn" id="lt_diag" style="display:none" data-i18n="lt.see"></button></div>
  </div>
  <div class="card"><h2 data-i18n="cmp.h"></h2>
    <ol class="small"><li data-i18n="cmp.1"></li><li data-i18n="cmp.2"></li><li data-i18n="cmp.3"></li></ol>
    <p class="small muted" data-i18n="cmp.p"></p></div>
</section>

<!-- ============ DIAGNOSIS ============ -->
<section id="tab-diag" class="tab">
  <div class="card"><div class="row"><label for="dsess" style="margin:0" data-i18n="diag.session"></label><select id="dsess" style="min-width:320px"></select>
    <a class="btn" id="x_html" target="_blank" data-i18n="diag.report"></a><a class="btn" id="x_csv">CSV</a><a class="btn" id="x_json">JSON</a></div></div>
  <div id="dbody"></div>
</section>

<!-- ============ ROUTER ============ -->
<section id="tab-router" class="tab">
  <div class="card">
    <h2 data-i18n="router.h"></h2>
    <p class="small" data-i18n-html="router.p"></p>
    <div class="grid">
      <div><label data-i18n="r.model"></label><input id="r_model" style="width:100%" data-i18n-ph="r.model_ph"><label data-i18n="r.hw"></label><input id="r_hw" style="width:100%" data-i18n-ph="r.hw_ph"><label data-i18n="r.fw"></label><input id="r_fw" style="width:100%" data-i18n-ph="r.fw_ph"></div>
      <div><label data-i18n="r.qos"></label><select id="r_qos"><option value="" data-i18n="opt.dontknow"></option><option value="true" data-i18n="opt.yes"></option><option value="false" data-i18n="opt.no"></option></select>
        <label data-i18n="r.type"></label><select id="r_type"><option value="unknown" data-i18n="opt.dontknow"></option><option value="priority" data-i18n="r.type.priority"></option><option value="bandwidth_limit" data-i18n="r.type.limit"></option><option value="sqm" data-i18n="r.type.sqm"></option></select>
        <label data-i18n="r.sqm"></label><select id="r_sqm"><option value="unknown" data-i18n="r.sqm.unknown"></option><option value="yes" data-i18n="r.sqm.yes"></option><option value="no" data-i18n="opt.no"></option></select></div>
      <div><label data-i18n="r.ld"></label><input id="r_ld" type="number" min="0" step="any" style="width:100%"><label data-i18n="r.lu"></label><input id="r_lu" type="number" min="0" step="any" style="width:100%">
        <label data-i18n="r.unit"></label><select id="r_unit"><option>Mbps</option><option>Kbps</option><option>Gbps</option></select></div>
      <div><label data-i18n="r.plan"></label><div class="row"><input id="p_down" type="number" min="0" step="any" style="width:48%"><input id="p_up" type="number" min="0" step="any" style="width:48%"></div>
        <label data-i18n="r.gw"></label><input id="g_over" style="width:100%" placeholder="192.168.0.1"></div>
    </div>
    <label data-i18n-html="r.prio"></label><textarea id="r_prio"></textarea>
    <label data-i18n-html="r.rules"></label><textarea id="r_rules"></textarea>
    <label data-i18n="r.notes"></label><textarea id="r_notes"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="r_save" data-i18n="r.save"></button><span id="r_msg" class="muted"></span></div>
    <h3 data-i18n="r.shots"></h3>
    <p class="small muted" data-i18n="r.shots_note"></p>
    <input type="file" id="r_file" accept="image/png,image/jpeg,image/webp" multiple><div id="r_shots"></div>
  </div>
  <div class="card"><h2 data-i18n="r.analysis_h"></h2><div id="r_analysis" class="small">…</div></div>
  <div class="card"><h2 data-i18n="r.protocol_h"></h2><ol id="r_proto" class="small"></ol></div>
</section>

<!-- ============ HISTORY ============ -->
<section id="tab-hist" class="tab">
  <div class="card"><h2 data-i18n="hist.h"></h2><div style="overflow-x:auto"><table id="htab"></table></div>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="cmp" data-i18n="hist.compare"></button><span class="small muted" data-i18n="hist.hint"></span></div>
    <div id="cmpres"></div></div>
</section>

<!-- ============ HELP ============ -->
<section id="tab-help" class="tab">
  <div class="card"><h2 data-i18n="help.proto_h"></h2>
    <ol><li data-i18n-html="help.p1"></li><li data-i18n-html="help.p2"></li><li data-i18n="help.p3"></li><li data-i18n-html="help.p4"></li><li data-i18n="help.p5"></li><li data-i18n-html="help.p6"></li><li data-i18n-html="help.p7"></li></ol></div>
  <div class="card"><h2 data-i18n="help.defs_h"></h2><ul>
    <li data-i18n-html="help.d1"></li><li data-i18n-html="help.d2"></li><li data-i18n-html="help.d3"></li><li data-i18n-html="help.d4"></li><li data-i18n-html="help.d5"></li><li data-i18n-html="help.d6"></li></ul></div>
  <div class="card"><h2 data-i18n="help.limits_h"></h2><ul>
    <li data-i18n="help.l1"></li><li data-i18n-html="help.l2"></li><li data-i18n="help.l3"></li><li data-i18n="help.l4"></li></ul></div>
  <div class="card"><h2 data-i18n="help.priv_h"></h2><ul>
    <li data-i18n-html="help.v1"></li><li data-i18n="help.v2"></li><li data-i18n="help.v3"></li></ul></div>
</section>
</main>
<div id="toast"></div>

<script>

 'help.proto_h': 'Protocol to capture your next lag episode',
 'help.p1': 'When you are at the computer, on your usual connection, start a <b>30-minute monitoring</b> (Monitoring tab). Enter your game server as the custom destination if you know it.',
 'help.p2': 'Play / work normally. At the first sign of lag, click <b>"I\'m lagging now"</b> (once per episode, as many times as needed in a session).',
 'help.p3': 'Note on the side: what (game, call, web page), Wi‑Fi or cable, which other people/devices were using the Internet.',
 'help.p4': 'When the session is over, open <b>Diagnosis</b>: read the main hypothesis, its evidence, its limits and the "next useful test".',
 'help.p5': 'If the lag did not occur during the session, try again another day/time: without a captured episode, the tool cannot state anything.',
 'help.p6': 'Then run <b>a saturation test</b> (outside a lag period) over Wi‑Fi and then over Ethernet.',
 'help.p7': 'Export the <b>HTML report</b> (and CSV/JSON if needed) to keep it or show it to your provider.',
 'help.defs_h': 'Definitions', 'help.d1': '<b>Median</b>: central value of the replies received.', 'help.d2': '<b>p95</b>: 95 % of the replies are faster than this value.',
 'help.d3': '<b>Loss</b>: requests without reply ÷ requests sent. Putting the computer to sleep is not counted as loss.', 'help.d4': '<b>Jitter</b>: mean of |RTT(i) − RTT(i−1)| between two consecutive replies (a loss breaks the chain).',
 'help.d5': '<b>Bufferbloat</b>: latency increase when the line is loaded, caused by queues that are too long (modem, router).', 'help.d6': '<b>Priority QoS ≠ SQM</b>: prioritisation orders the packets; queue management (SQM: fq_codel, CAKE…) stops queues from growing. Your model does not necessarily have it.',
 'help.limits_h': 'What the tool cannot know',
 'help.l1': 'A ping loss is not always a real loss (routers that rarely answer pings); a loss on an intermediate traceroute hop with no loss at the destination is not a real loss.',
 'help.l2': 'The measured traffic is that of <b>this</b> computer, not of the whole home; no guilty program is named.', 'help.l3': 'Radio interference is not measured; only the signal, channel, link rates and visible Wi‑Fi neighbours are read.',
 'help.l4': 'The game can lag without any network problem (overloaded computer, server): the tool says so when the network is healthy during your report.',
 'help.priv_h': 'Privacy and rights',
 'help.v1': 'Everything stays on this computer (<code id="datadir">data folder</code>). The only external traffic: pings/DNS to the targets and, only on your request, the saturation test.',
 'help.v2': 'No communication content is captured. No router password is requested or stored. The server only listens on 127.0.0.1.',
 'help.v3': 'No administrator rights are needed: pings use the Windows ICMP API (no raw socket), DNS is queried with a plain UDP request, traffic comes from the interface counters. Per-program attribution would need them (ETW/driver capture) — deliberately not used.'

async function api(path, body) {
  const headers = {'X-Lang': LANG};
  const opt = body === undefined ? {headers} : {method: 'POST', headers: {...headers, 'Content-Type': 'application/json'}, body: JSON.stringify(body)};
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({error: 'Unreadable response'}));

  return j;
}

// ---------------------------------------------------------------- canvas charts
function chart(canvas, o) {
  const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const g = canvas.getContext('2d'); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement), muted = css.getPropertyValue('--muted'), line = css.getPropertyValue('--line'), danger = css.getPropertyValue('--danger');
  const L = 44, R = 8, T = 8, B = 20, t0 = o.t0, t1 = Math.max(o.t1, t0 + 1);
  const vals = o.series.flatMap(s => s.pts.map(p => p[1])).sort((a, b) => a - b);
  let ymax = o.ymax || (vals.length ? vals[Math.min(vals.length - 1, Math.floor(vals.length * 0.995))] * 1.3 : 10);
  ymax = Math.max(ymax, o.ymin_top || 1);
  const X = x => L + (x - t0) / (t1 - t0) * (w - L - R), Y = v => T + (1 - Math.min(v, ymax) / ymax) * (h - T - B);
  g.font = '11px system-ui'; g.fillStyle = muted; g.strokeStyle = line; g.lineWidth = 1;
  (o.phases || []).forEach(p => { g.fillStyle = 'rgba(128,128,128,.15)'; g.fillRect(X(p.t0), T, Math.max(1, X(p.t1) - X(p.t0)), h - T - B); g.fillStyle = muted; if (X(p.t1) - X(p.t0) > 48) g.fillText(p.name, X(p.t0) + 2, T + 10); });
  for (let i = 0; i <= 4; i++) { const y = T + i * (h - T - B) / 4; g.beginPath(); g.moveTo(L, y); g.lineTo(w - R, y); g.stroke(); g.fillStyle = muted; g.textAlign = 'right'; g.fillText((ymax * (1 - i / 4)).toFixed(ymax < 10 ? 1 : 0), L - 4, y + 4); }
  g.textAlign = 'center'; for (let i = 0; i <= 5; i++) { const x = t0 + (t1 - t0) * i / 5; g.fillText(new Date(x * 1000).toLocaleTimeString(loc(), {hour: '2-digit', minute: '2-digit', second: (t1 - t0) < 600 ? '2-digit' : undefined}), X(x), h - 5); }
  if (!vals.length) { g.textAlign = 'center'; g.fillStyle = muted; g.fillText(t('chart.nodata'), w / 2, h / 2); }
  o.series.forEach(s => {
    g.strokeStyle = s.color; g.lineWidth = 1.4; g.beginPath(); let prev = null;
    s.pts.forEach(p => { const x = X(p[0]), y = Y(p[1]); if (prev === null || p[0] - prev > (o.gap || 6)) g.moveTo(x, y); else g.lineTo(x, y); prev = p[0]; });
    g.stroke();
    g.strokeStyle = s.color; g.lineWidth = 2; (s.lost || []).forEach(x => { g.beginPath(); g.moveTo(X(x), h - B - 7); g.lineTo(X(x), h - B); g.stroke(); });
  });
  (o.marks || []).forEach(m => { g.strokeStyle = danger; g.setLineDash([4, 3]); g.beginPath(); g.moveTo(X(m.t), T); g.lineTo(X(m.t), h - B); g.stroke(); g.setLineDash([]); });
}
function legend(el, series) { $(el).innerHTML = series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join(''); }
function pingSeries(map, targets) {
  return targets.map(tg => {
    const raw = (map['ping:' + tg.id] || []).filter(p => p[3] !== 'icmp_no_reply');
    const answered = raw.some(p => p[2]);
    return {name: tg.label, color: COLORS[tg.id] || '#555', pts: raw.filter(p => p[2] && p[1] != null).map(p => [p[0], p[1]]), lost: answered ? raw.filter(p => !p[2]).map(p => p[0]) : []};
  });
}
const simple = (map, key, name, color, scale = 1) => ({name, color, pts: (map[key] || []).filter(p => p[2] && p[1] != null).map(p => [p[0], p[1] / scale]), lost: (map[key] || []).filter(p => !p[2]).map(p => p[0])});
function drawAll(map, targets, t0, t1, marks, phases, ids = {lat: 'c_lat', net: 'c_net', dns: 'c_dns', wifi: 'c_wifi', ll: 'l_lat', ln: 'l_net', ld: 'l_dns', lw: 'l_wifi', wc: 'wifi_card'}) {
  const lat = pingSeries(map, targets); chart($('#' + ids.lat), {series: lat, t0, t1, marks, phases}); legend('#' + ids.ll, lat);
  const net = [simple(map, 'net:down_bps', t('s.pc_down'), '#0969da', 1e6), simple(map, 'net:up_bps', t('s.pc_up'), '#bc4c00', 1e6)];
  if (map['load:down_bps']) net.push(simple(map, 'load:down_bps', t('s.test_down'), '#1a7f37', 1e6));
  if (map['load:up_bps']) net.push(simple(map, 'load:up_bps', t('s.test_up'), '#8250df', 1e6));
  chart($('#' + ids.net), {series: net, t0, t1, marks, phases, ymin_top: 1}); legend('#' + ids.ln, net);
  const dns = [simple(map, 'dns:sys_hit', t('s.dns_hit'), '#1a7f37'), simple(map, 'dns:sys_miss', t('s.dns_miss'), '#bc4c00'), simple(map, 'dns:ref_miss', t('s.dns_ref'), '#8250df')];
  chart($('#' + ids.dns), {series: dns, t0, t1, marks, phases, gap: 20}); legend('#' + ids.ld, dns);
  const wf = map['wifi:signal'] ? [simple(map, 'wifi:signal', t('s.sig'), '#8250df'), simple(map, 'wifi:tx', t('s.tx'), '#0969da'), simple(map, 'wifi:rx', t('s.rx'), '#1a7f37')] : [];
  $('#' + ids.wc).style.display = wf.length ? '' : 'none';
  if (wf.length) { chart($('#' + ids.wifi), {series: wf, t0, t1, marks, phases, gap: 20}); legend('#' + ids.lw, wf); }
}

async function poll() {

  let h = `<div class="card"><h2>${esc(t('diag.sum_h', s.id, s.label || t('diag.nolabel'), dt(s.started), hm(s.ended), s.link))}</h2>${a.summary.map(x => `<p>${esc(x)}</p>`).join('')}</div>`;
  h += `<div class="card"><h2>${t('diag.hyp_h')}</h2><p class="small muted">${t('diag.hyp_note')}</p>`;
  h += a.hypotheses.length ? a.hypotheses.map(x => `<div class="card" style="margin:8px 0"><h3 style="margin-top:0">${esc(x.title)} <span class="badge b-${x.level}">${esc(t('diag.confidence', lvl(x.level)))}</span></h3><b>${t('diag.evidence')}</b>${ul(x.evidence)}${x.counter.length ? `<b>${t('diag.counter')}</b>` + ul(x.counter) : ''}<b>${t('diag.limits')}</b>${ul(x.limits)}<p><b>${t('diag.next')}</b> ${esc(x.next_test)}</p></div>`).join('') : `<p>${t('diag.nohyp')}</p>`;
  if (a.unlikely.length) h += `<h3>${t('diag.unlikely')}</h3><ul>` + a.unlikely.map(u => `<li><b>${esc(u.title)}</b> — ${esc(u.reasons.join(' '))}</li>`).join('') + '</ul>';
  if (a.not_evaluated.length) h += `<h3>${t('diag.noteval')}</h3><ul>` + a.not_evaluated.map(u => `<li><b>${esc(u.title)}</b> — ${esc(u.reason)}</li>`).join('') + '</ul>';
  h += '</div>';
  if (a.actions.length) h += `<div class="card"><h2>${t('diag.actions')}</h2><ol>${a.actions.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`;
  h += `<div class="card"><h2>${t('diag.timeline')}</h2>` + (a.timeline.length ? a.timeline.map(i => `<div class="tl ${i.type}"><b>${hm(i.t)}</b> — ${esc(t('type.' + i.type))}${i.zone ? ' — <b>' + esc(t('zone.' + i.zone)) + '</b>' : ''}<div class="small">${esc(i.zone_text || '')}</div>${(i.details || []).map(d => `<div class="small muted">${esc(d)}</div>`).join('')}${i.note ? `<div class="small muted">${esc(i.note)}</div>` : ''}</div>`).join('') : `<p class="muted">${t('diag.noinc')}</p>`) + '</div>';
  h += `<div class="card"><h2>${t('diag.curves')}</h2><canvas id="d_lat"></canvas><div class="legend" id="dl_lat"></div><canvas id="d_net"></canvas><div class="legend" id="dl_net"></div><canvas id="d_dns" style="height:150px"></canvas><div class="legend" id="dl_dns"></div><div id="d_wc"><canvas id="d_wifi" style="height:150px"></canvas><div class="legend" id="dl_wifi"></div></div></div>`;
  h += `<div class="card"><h2>${t('diag.measures')}</h2><div style="overflow-x:auto"><table><tr><th>${t('th.target')}</th><th>${t('th.state')}</th><th class="n">${t('th.req')}</th><th class="n">${t('th.loss')}</th><th class="n">${t('th.median')}</th><th class="n">p95</th><th class="n">${t('th.max')}</th><th class="n">${t('th.jitter')}</th></tr>` +
    a.stats.targets.map(x => row(x.label + ' — ' + x.host, x.state_text, x.stats)).join('') + [['sys_hit', 'diag.dns_hit'], ['sys_miss', 'diag.dns_miss'], ['ref_miss', 'diag.dns_ref']].filter(k => a.stats.dns[k[0]]).map(k => row(t(k[1]), t('diag.measured'), a.stats.dns[k[0]])).join('') +
    `</table></div><p class="small muted">${t('diag.meas_note')}</p>`;
  const tr = a.stats.traffic; if (tr.down) h += `<p class="small">${esc(t('diag.traffic_line', fmt(tr.down.median, 2), fmt(tr.down.max, 1), fmt(tr.up.median, 2), fmt(tr.up.max, 1)))}</p>`;
  const w = a.stats.wifi; if (w) h += `<p class="small">${esc(t('diag.wifi_line', fmt(w.signal_med), fmt(w.signal_min), w.channel ?? '?', w.band ?? '?', fmt(w.tx_med), fmt(w.rx_med)))}</p>`;
  h += '</div>';
  if (a.bufferbloat) { h += `<div class="card"><h2>${t('diag.sat_h')}</h2><table><tr><th>${t('th.dir')}</th><th class="n">${t('th.sustained')}</th><th class="n">${t('th.idle_load')}</th><th class="n">${t('th.increase')}</th><th class="n">${t('th.p95load')}</th><th class="n">${t('th.maxloss')}</th><th class="n">${t('th.gwinc')}</th><th>${t('th.grade')}</th></tr>`;
    for (const k of ['down', 'up']) { const x = a.bufferbloat.directions[k]; if (x) h += `<tr><td>${t('dir.' + k)}</td><td class="n">${fmt(x.mbps)} Mbps</td><td class="n">${fmt(x.idle_med)} → ${fmt(x.load_med)} ms</td><td class="n">+${fmt(x.delta)} ms</td><td class="n">${fmt(x.load_p95)} ms</td><td class="n">${fmt(x.loss_pct, 1)} %</td><td class="n">${x.gw_delta != null ? '+' + fmt(x.gw_delta) + ' ms' : '—'}</td><td>${esc(x.grade || '—')}${x.valid ? '' : t('diag.inconclusive')}</td></tr>`; }
    h += `</table><p class="small muted">${t('diag.grades')}</p></div>`; }
  $('#dbody').innerHTML = h;
  const mp = {}; for (const [k, v] of Object.entries(sd.series)) mp[k] = v.map(p => [p[0], p[1], p[2], '']);
  drawAll(mp, sd.targets, sd.started, sd.ended, sd.marks.filter(m => m.kind === 'lag'), sd.phases, {lat: 'd_lat', net: 'd_net', dns: 'd_dns', wifi: 'd_wifi', ll: 'dl_lat', ln: 'dl_net', ld: 'dl_dns', lw: 'dl_wifi', wc: 'd_wc'});
}
function row(l, state, s) {
  if (!s) return `<tr><td>${esc(l)}</td><td>${esc(state)}</td><td class="n" colspan="6">—</td></tr>`;
  return `<tr><td>${esc(l)}</td><td>${esc(state)}</td><td class="n">${s.n}</td><td class="n ${s.loss_pct >= 2 ? 'bad' : ''}">${fmt(s.loss_pct, 1)}</td><td class="n">${fmt(s.median, 1)}</td><td class="n">${fmt(s.p95, 1)}</td><td class="n">${fmt(s.max, 0)}</td><td class="n">${fmt(s.jitter, 1)}</td></tr>`;
}

// ---------------------------------------------------------------- router
const lines = txt => txt.split('\n').map(l => l.split('|').map(x => x.trim())).filter(p => p[0]);
async function loadRouter() {
  const [v, c] = await Promise.all([api('/api/router'), api('/api/config')]), r = v.config || {};
  $('#r_model').value = r.model || ''; $('#r_hw').value = r.hw_version || ''; $('#r_fw').value = r.firmware || '';
  $('#r_qos').value = r.qos_enabled === true ? 'true' : r.qos_enabled === false ? 'false' : ''; $('#r_type').value = r.qos_type || 'unknown'; $('#r_sqm').value = r.sqm_available || 'unknown';
  $('#r_ld').value = r.limit_down ?? ''; $('#r_lu').value = r.limit_up ?? ''; $('#r_unit').value = r.unit || 'Mbps';
  $('#p_down').value = c.plan_down_mbps ?? ''; $('#p_up').value = c.plan_up_mbps ?? ''; $('#g_over').value = c.gateway_override || ''; if (c.custom_target) $('#custom').value = c.custom_target;
  $('#r_prio').value = (r.priority_devices || []).map(d => [d.name, d.priority || '', d.duration || ''].join(' | ')).join('\n');
  $('#r_rules').value = (r.bandwidth_rules || []).map(d => [d.name, d.down ?? '', d.up ?? ''].join(' | ')).join('\n'); $('#r_notes').value = r.notes || '';
  $('#r_shots').innerHTML = (r.screenshots || []).map(n => `<span><a href="/api/router/shot/${n}" target="_blank"><img class="thumb" src="/api/router/shot/${n}"></a><button class="btn" data-del="${n}" style="padding:0 6px">✕</button></span>`).join('');
  $$('#r_shots [data-del]').forEach(b => b.onclick = guard(async () => { await api('/api/router/shot/delete', {name: b.dataset.del}); loadRouter(); }));
  const an = v.analysis;
  $('#r_analysis').innerHTML = (v.measures_from_session ? `<p class="muted">${esc(t('r.measures_from', v.measures_from_session, fmt(v.measured.down), fmt(v.measured.up)))}</p>` : `<p class="warn">${t('r.no_test')}</p>`) +
    (an.findings.length ? '<ul>' + an.findings.map(f => `<li class="sev-${f.severity}"><b>${esc(t('sev.' + f.severity))}</b> — ${esc(f.text)}</li>`).join('') + '</ul>' : `<p class="muted">${t('r.nothing')}</p>`) +
    (an.proposals.length ? `<h3>${t('r.proposals')}</h3>` + an.proposals.map(p => `<div class="card"><b>${esc(p.change)}</b><br>${t('r.why')} ${esc(p.justification)}<br>${t('r.rollback')} ${esc(p.rollback)}</div>`).join('') : '') + `<p class="muted">${esc(an.reminder)}</p>`;
  $('#r_proto').innerHTML = an.protocol.map(x => `<li>${esc(x)}</li>`).join('');
}
$('#r_save').onclick = guard(async () => {
  const num = id => $(id).value === '' ? null : +$(id).value;
  const router = {model: $('#r_model').value, hw_version: $('#r_hw').value, firmware: $('#r_fw').value, qos_enabled: $('#r_qos').value === '' ? null : $('#r_qos').value === 'true', qos_type: $('#r_type').value,
    sqm_available: $('#r_sqm').value, limit_down: num('#r_ld'), limit_up: num('#r_lu'), unit: $('#r_unit').value, notes: $('#r_notes').value,
    priority_devices: lines($('#r_prio').value).map(p => ({name: p[0], priority: p[1] || '', duration: p[2] || ''})), bandwidth_rules: lines($('#r_rules').value).map(p => ({name: p[0], down: p[1] === '' ? null : +p[1], up: p[2] === '' ? null : +p[2]}))};
  await api('/api/config', {router, plan_down_mbps: num('#p_down'), plan_up_mbps: num('#p_up'), gateway_override: $('#g_over').value, custom_target: $('#custom').value});
  $('#r_msg').textContent = t('r.saved'); loadRouter();
});
$('#r_file').onchange = guard(async () => {
  for (const f of $('#r_file').files) {
    const uri = await new Promise((ok, ko) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = ko; fr.readAsDataURL(f); });
    await api('/api/router/shot', {data: uri});
  }
  $('#r_file').value = ''; loadRouter();
});

// ---------------------------------------------------------------- history
let hsel = {a: new Set(), b: new Set()};
async function loadHist() {
  const list = await api('/api/sessions');
  $('#htab').innerHTML = `<tr><th>A</th><th>B</th><th>#</th><th>${t('hist.th.date')}</th><th>${t('hist.th.label')}</th><th>${t('hist.th.link')}</th><th class="n">${t('hist.th.duration')}</th><th class="n">${t('hist.th.incidents')}</th><th class="n">${t('hist.th.gw')}</th><th class="n">${t('hist.th.inet')}</th><th class="n">${t('hist.th.loss')}</th><th class="n">${t('hist.th.dup')}</th><th class="n">${t('hist.th.ddown')}</th><th class="n">${t('hist.th.speed')}</th><th></th></tr>` +
    list.map(s => { const m = s.metrics || {}; return `<tr><td><input type="checkbox" data-g="a" value="${s.id}" ${hsel.a.has(s.id) ? 'checked' : ''}></td><td><input type="checkbox" data-g="b" value="${s.id}" ${hsel.b.has(s.id) ? 'checked' : ''}></td>
      <td>${s.id}</td><td>${dt(s.started)}</td><td><span data-ren="${s.id}" title="${esc(t('hist.rename'))}" style="cursor:text">${esc(s.label || '—')}</span></td><td>${esc(s.link || '')}</td><td class="n">${s.ended ? fmt((s.ended - s.started) / 60) + ' min' : t('hist.running')}</td><td class="n">${m.incidents ?? '—'}</td>
      <td class="n">${fmt(m.gw_p95, 1)}</td><td class="n">${fmt(m.inet_p95, 1)}</td><td class="n">${fmt(m.inet_loss, 1)}</td><td class="n">${m.bloat_up != null ? '+' + fmt(m.bloat_up) : '—'}</td><td class="n">${m.bloat_down != null ? '+' + fmt(m.bloat_down) : '—'}</td><td class="n">${fmt(m.down_mbps)} / ${fmt(m.up_mbps)}</td>
      <td><button class="btn" data-open="${s.id}" style="padding:0 8px">${t('hist.open')}</button> <button class="btn" data-rm="${s.id}" style="padding:0 8px">${t('hist.delete')}</button></td></tr>`; }).join('');
  $$('#htab [data-g]').forEach(c => c.onchange = () => { const set = hsel[c.dataset.g], id = +c.value; c.checked ? set.add(id) : set.delete(id); });
  $$('#htab [data-open]').forEach(b => b.onclick = () => { showTab('diag'); setTimeout(async () => { $('#dsess').value = b.dataset.open; await showDiag(b.dataset.open); }, 300); });
  $$('#htab [data-rm]').forEach(b => b.onclick = guard(async () => { if (confirm(t('hist.confirm_delete', b.dataset.rm))) { await api(`/api/session/${b.dataset.rm}/delete`, {}); loadHist(); } }));
  $$('#htab [data-ren]').forEach(b => b.onclick = guard(async () => { const l = prompt(t('hist.rename_prompt'), b.textContent === '—' ? '' : b.textContent); if (l !== null) { await api(`/api/session/${b.dataset.ren}/label`, {label: l}); loadHist(); } }));
}
$('#cmp').onclick = guard(async () => {
  const r = await api('/api/compare', {a: [...hsel.a], b: [...hsel.b]});
  $('#cmpres').innerHTML = r.rows.length ? `<h3>${esc(t('cmp.res_h', r.n_a, r.n_b))}</h3><table><tr><th>${t('cmp.th.metric')}</th><th class="n">A</th><th class="n">B</th><th class="n">${t('cmp.th.gap')}</th><th class="n">${t('cmp.th.var')}</th><th>${t('cmp.th.verdict')}</th></tr>` +
    r.rows.map(x => `<tr><td>${esc(x.metric)}</td><td class="n">${fmt(x.a, 1)}</td><td class="n">${fmt(x.b, 1)}</td><td class="n">${x.delta > 0 ? '+' : ''}${fmt(x.delta, 1)}</td><td class="n">${fmt(x.variability, 1)}</td><td class="${x.verdict === 'improvement' ? 'sev-ok' : x.verdict === 'degradation' ? 'sev-problem' : ''}">${esc(x.verdict_text)}</td></tr>`).join('') + `</table><p class="small muted">${t('cmp.note')}</p>` : `<p class="warn">${t('cmp.empty')}</p>`;
});

// ---------------------------------------------------------------- start
applyI18n(); loadEnv(false); api('/api/config').then(c => { $('#custom').value = c.custom_target || ''; }).catch(() => {});
poll();
const TABS = ['live', 'sat', 'diag', 'router', 'hist', 'help'];
const startTab = location.hash.slice(1); if (TABS.includes(startTab)) showTab(startTab);
onhashchange = () => { const h = location.hash.slice(1); if (TABS.includes(h)) showTab(h); };
</script>
</body>
</html>
